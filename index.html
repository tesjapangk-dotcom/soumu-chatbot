<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEsJapan 総務部アシスタント</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif;
    background: #f0f4f8;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    background: linear-gradient(135deg, #1a3a5c 0%, #2e6da4 100%);
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    flex-shrink: 0;
  }
  .header-icon {
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .header-text h1 { font-size: 16px; font-weight: bold; }
  .header-text p  { font-size: 11px; opacity: 0.85; margin-top: 2px; }
  .status-dot {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; opacity: 0.9;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4ade80;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .message { display: flex; gap: 10px; max-width: 80%; }
  .message.user  { align-self: flex-end;  flex-direction: row-reverse; }
  .message.bot   { align-self: flex-start; }
  .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .message.user .avatar { background: #2e6da4; }
  .message.bot  .avatar { background: #e3f0ff; }
  .bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.7;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .message.user .bubble {
    background: #2e6da4;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .message.bot .bubble {
    background: white;
    color: #333;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .message.bot .bubble.error {
    background: #fff0f0;
    border-left: 3px solid #e53935;
    color: #c62828;
  }
  .faq-image {
    margin-top: 10px;
    max-width: 100%;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    display: block;
  }
  .faq-video {
    margin-top: 10px;
    width: 100%;
    max-width: 100%;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    display: block;
  }
  iframe.faq-video { aspect-ratio: 16 / 9; border: none; }
  .faq-doc {
    margin-top: 10px;
    margin-right: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    background: #e3f0ff;
    color: #1a3a5c;
    border: 1px solid #b3d4f5;
    border-radius: 10px;
    font-size: 13px;
    font-weight: bold;
    text-decoration: none;
    transition: background 0.15s;
  }
  .faq-doc:hover { background: #cfe4fb; }
  .typing-dots { display: flex; gap: 4px; align-items: center; padding: 4px 0; }
  .typing-dots span {
    width: 8px; height: 8px; border-radius: 50%;
    background: #90a4ae;
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

  .quick-bar {
    padding: 10px 16px;
    background: white;
    border-top: 1px solid #e0e0e0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .quick-bar span { font-size: 11px; color: #888; align-self: center; }
  .quick-btn {
    padding: 5px 12px;
    background: #e3f0ff;
    color: #1a3a5c;
    border: 1px solid #b3d4f5;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .quick-btn:hover { background: #2e6da4; color: white; border-color: #2e6da4; }

  .input-area {
    padding: 12px 16px;
    background: white;
    border-top: 1px solid #e0e0e0;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }
  textarea {
    flex: 1;
    border: 1.5px solid #d0d7de;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    max-height: 120px;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.5;
  }
  textarea:focus { border-color: #2e6da4; }
  textarea::placeholder { color: #aaa; }
  .send-btn {
    width: 44px; height: 44px;
    background: #2e6da4;
    border: none;
    border-radius: 12px;
    color: white;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #1a3a5c; }
  .send-btn:disabled { background: #b0bec5; cursor: not-allowed; }

  .welcome {
    text-align: center;
    padding: 30px 20px;
    color: #546e7a;
  }
  .welcome .icon { font-size: 48px; margin-bottom: 12px; }
  .welcome h2 { font-size: 18px; color: #1a3a5c; margin-bottom: 8px; }
  .welcome p  { font-size: 13px; line-height: 1.8; }

  .chat-area::-webkit-scrollbar { width: 6px; }
  .chat-area::-webkit-scrollbar-thumb { background: #b0bec5; border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">🤖</div>
  <div class="header-text">
    <h1>総務部アシスタント</h1>
    <p>備品・申請・施設・仕訳に関する質問はこちらへ</p>
  </div>
  <div class="status-dot"><div class="dot"></div>稼働中</div>
</div>

<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcomeMsg">
    <div class="icon">💬</div>
    <h2>総務部アシスタントへようこそ！</h2>
    <p>備品の場所・申請方法・会議室予約・仕訳科目など<br>
    総務部に関する質問を何でも聞いてください。<br>
    操作手順がある質問には画像・動画・資料PDFもあわせて表示されます。<br><br>
    下の入力欄に質問をどうぞ！</p>
  </div>
</div>

<div class="quick-bar">
  <span>よく聞かれる質問：</span>
  <button class="quick-btn" onclick="sendQuick('コピー用紙はどこにありますか？')">📦 コピー用紙の場所</button>
  <button class="quick-btn" onclick="sendQuick('会議室の予約方法を教えてください')">📅 会議室予約</button>
  <button class="quick-btn" onclick="sendQuick('交通費精算はどうすればいいですか？')">💴 交通費精算</button>
  <button class="quick-btn" onclick="sendQuick('総務部の連絡先を教えてください')">📞 総務部連絡先</button>
  <button class="quick-btn" onclick="sendQuick('通勤手当の仕訳科目と消費税区分を教えてください')">📒 仕訳科目を調べる</button>
</div>

<div class="input-area">
  <textarea id="userInput" placeholder="質問を入力してください（例：交際費AとBの違いは？）"
    rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
// ── Cloudflare Worker の URL（APIキーはここに書かない）──
const WORKER_URL = 'https://tesjapan-claude-proxy.tesjapan-gk.workers.dev';

// ── 未回答の質問をスプレッドシートに書き足すGoogle Apps Script（Webアプリ）のURL ──
const APPEND_URL = 'https://script.google.com/macros/s/AKfycbwCFkACr2rkWmYh9Cig3E2xgXUgCD_pHpRcSooXvCiHUH7ijvBpKU_UY6SlyvCKyeEkTg/exec';

// ── FAQに無い質問が来たときにClaudeへ出力させる目印（この文字列を検知して固定メッセージに差し替える）──
const NOT_FOUND_TAG = '[[NOT_FOUND]]';

// ── スプレッドシートのCSV URL（複数シート対応）──
// 列構成: A=カテゴリ / B=質問(Q) / C=回答(A) / D=有効/無効 / E=備考 / F=画像ファイル名 / G=動画ファイル名(またはYouTube等のURL) / H=資料ファイル名またはURL(Google DriveのPDF共有リンク等)
const SHEET_URLS = [
  'https://docs.google.com/spreadsheets/d/e/2PACX-1vS58EhGfnsQGKLU8GdsY8QTEhIz5zBrnrrPPQSlB0JBcUl2gmZjvuERqUrglZkf6adKx8q6CkoAy6rR/pub?gid=0&single=true&output=csv',
];

// ── 画像・動画データ（ファイル名の代わりに直接Base64等を埋め込みたい場合はここに追加）──
const IMAGE_DATA = {};
const VIDEO_DATA = {};

// スプレッドシートから読み込んだFAQ一覧（画像・動画の紐付け判定に使用）
let FAQ_DATA = [];

// ── システムプロンプト ──
const SYSTEM_PROMPT_BASE = 'あなたはテスジャパンの総務部担当アシスタントです。\n以下の「社内FAQ・資料」の内容だけを根拠にして、社員の質問に日本語で答えてください。\n\n【重要なルール】\n- 資料に書いていないことは、他の文章を一切書かず、正確に次の1行だけを出力する：[[NOT_FOUND]]\n- 質問がFAQのQと一致・類似している場合は、そのAの内容を必ずそのまま回答する。話題が総務らしくない・雑談っぽい等の理由で回答を拒否したり、範囲外だと注釈を付けたりしないこと\n- 仕訳科目・消費税区分・経費・財務に関する質問への回答末尾は「ご不明な点がございましたら、財務部（内線：81257）までお問合せください。」とする\n- 回答は簡潔に、でも必要な情報は漏らさず答える\n- 親しみやすい丁寧な敬語で答える\n\n【社内FAQ・資料】\n';
let SYSTEM_PROMPT = SYSTEM_PROMPT_BASE;

function parseCSVLine(line) {
  const result = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') { inQ = !inQ; }
    else if (line[i] === ',' && !inQ) { result.push(cur); cur = ''; }
    else { cur += line[i]; }
  }
  result.push(cur);
  return result;
}

// 複数シートをまとめて読み込む
(async () => {
  try {
    let faq = '';
    for (const url of SHEET_URLS) {
      // Googleの「ウェブに公開」CSVはURLをキャッシュするため、毎回別URLに見せかけて最新版を取得する
      const bustedUrl = url + (url.includes('?') ? '&' : '?') + 'cachebust=' + Date.now();
      const r = await fetch(bustedUrl, { cache: 'no-store' });
      const csv = await r.text();
      const lines = csv.split('\n').slice(1); // 1行目（ヘッダー）をスキップ
      for (const line of lines) {
        if (!line.trim()) continue;
        const parts = parseCSVLine(line);
        // B列(parts[1])=質問, C列(parts[2])=回答, D列(parts[3])=有効/無効, F列(parts[5])=画像, G列(parts[6])=動画, H列(parts[7])=資料(PDF等)
        if (parts.length >= 4 && parts[3].trim() === '有効' && parts[1].trim()) {
          const q = parts[1].trim();
          const a = parts[2].trim();
          const image = (parts[5] || '').trim();
          const video = (parts[6] || '').trim();
          const doc = (parts[7] || '').trim();
          faq += 'Q: ' + q + '\nA: ' + a + '\n\n';
          FAQ_DATA.push({ q, a, image, video, doc });
        }
      }
    }
    SYSTEM_PROMPT = SYSTEM_PROMPT_BASE + faq;
    console.log('FAQ読み込み完了（' + FAQ_DATA.length + '件、画像/動画/資料付き' + FAQ_DATA.filter(r => r.image || r.video || r.doc).length + '件）');
  } catch(e) {
    console.error('FAQ読み込みエラー:', e);
  }
})();

// ── Google Drive/YouTubeの「普通の共有リンク」を、埋め込み表示できる形式に自動変換する ──
// (総務の方が共有→リンクをコピーしただけの状態でF/G列に貼れるようにするため)
function extractDriveFileId(url) {
  let m = url.match(/\/d\/([a-zA-Z0-9_-]{10,})/);
  if (m) return m[1];
  m = url.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
  return m ? m[1] : null;
}
function extractYouTubeId(url) {
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{6,})/);
  return m ? m[1] : null;
}
// 画像URL: DriveのリンクならGoogleユーザーコンテンツの直リンク形式に変換。それ以外(Unsplash等)はそのまま使う
function toEmbeddableImageUrl(url) {
  const driveId = extractDriveFileId(url);
  return driveId ? `https://lh3.googleusercontent.com/d/${driveId}` : url;
}
// 動画URL: Driveのリンクは/previewのiframe埋め込み形式に、YouTubeの視聴リンクはembed形式に変換
function toEmbeddableVideoUrl(url) {
  const driveId = extractDriveFileId(url);
  if (driveId) return `https://drive.google.com/file/d/${driveId}/preview`;
  const ytId = extractYouTubeId(url);
  return ytId ? `https://www.youtube.com/embed/${ytId}` : url;
}

// ── 質問文からFAQ行（画像・動画）を推定するマッチング ──
// FAQの質問(Q)から定型的な聞き方（「〜を教えてください」等）を取り除いて核となる語句を作り、
// ユーザーの入力文とその語句が互いに含み合うかで判定する（誤って無関係な画像を出さないよう、
// 部分一致だけの緩い判定は「他に候補がない場合の最終手段」としてのみ使う）
function coreKeyword(q) {
  let s = q.trim();
  const tails = [
    /について教えてください[。.!?？]*$/,
    /の(方法|やり方|手順)を教えてください[。.!?？]*$/,
    /を教えてください[。.!?？]*$/,
    /はどこにありますか[。.!?？]*$/,
    /はどこですか[。.!?？]*$/,
    /はどうすればいいですか[。.!?？]*$/,
    /はどうすればよいですか[。.!?？]*$/,
    /(したい|し方)[。.!?？]*$/,
    /は(何|なん)ですか[。.!?？]*$/,
    /を(使いたい|利用したい)[。.!?？]*$/,
    /[。.!?？]+$/,
  ];
  let changed = true;
  while (changed) {
    changed = false;
    for (const re of tails) {
      const next = s.replace(re, '');
      if (next !== s) { s = next; changed = true; }
    }
  }
  return s.trim();
}
function primaryNoun(key) {
  return (key.split(/[のをがはでとに]/)[0] || '').trim();
}
function findVisualForAnswer(userText) {
  const norm = userText.replace(/\s+/g, '');
  // 1段階目: 核となる語句どうしの包含関係（双方向）で厳密に判定
  let best = null, bestLen = 0;
  for (const row of FAQ_DATA) {
    if (!row.image && !row.video && !row.doc) continue;
    const key = coreKeyword(row.q);
    if (key.length < 2) continue;
    if (norm.includes(key) || key.includes(norm)) {
      if (key.length > bestLen) { bestLen = key.length; best = row; }
    }
  }
  if (best) return best;
  // 2段階目: 1段階目で見つからない場合のみ、主要な名詞句だけで緩く判定
  const candidates = [];
  for (const row of FAQ_DATA) {
    if (!row.image && !row.video && !row.doc) continue;
    const noun = primaryNoun(coreKeyword(row.q));
    if (noun.length >= 2 && norm.includes(noun)) candidates.push({ row, len: noun.length });
  }
  if (candidates.length === 0) return null;
  candidates.sort((a, b) => b.len - a.len);
  // 候補が複数タイで並ぶ場合は誤表示を避けるため何も返さない
  if (candidates.length > 1 && candidates[0].len === candidates[1].len) return null;
  return candidates[0].row;
}


const chatArea = document.getElementById('chatArea');
const userInput = document.getElementById('userInput');
const sendBtn   = document.getElementById('sendBtn');

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function sendQuick(text) { userInput.value = text; sendMessage(); }

function appendMessage(role, text, isError = false, imageFile = '', videoFile = '', docLink = '') {
  const w = document.getElementById('welcomeMsg');
  if (w) w.remove();
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? '👤' : '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (isError ? ' error' : '');
  bubble.textContent = text;
  if (imageFile) {
    const img = document.createElement('img');
    img.src = /^https?:\/\//.test(imageFile)
      ? toEmbeddableImageUrl(imageFile)
      : (IMAGE_DATA[imageFile] || `images/${imageFile}`);
    img.className = 'faq-image';
    img.alt = '参考画像';
    img.onerror = () => img.style.display = 'none';
    bubble.appendChild(img);
  }
  if (videoFile) {
    if (/^https?:\/\//.test(videoFile)) {
      // Google Driveの共有リンクやYouTubeの視聴リンクを自動で埋め込み用URLに変換する
      const iframe = document.createElement('iframe');
      iframe.src = toEmbeddableVideoUrl(videoFile);
      iframe.className = 'faq-video';
      iframe.allow = 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture';
      iframe.allowFullscreen = true;
      bubble.appendChild(iframe);
    } else {
      const video = document.createElement('video');
      video.src = VIDEO_DATA[videoFile] || `videos/${videoFile}`;
      video.className = 'faq-video';
      video.controls = true;
      video.onerror = () => video.style.display = 'none';
      bubble.appendChild(video);
    }
  }
  if (docLink) {
    // 資料(PDF等)はプレビュー埋め込みせず、新しいタブで開くリンクとして表示する
    // （Google Driveの共有リンクはiframe埋め込みができないため）
    // H列は "|" 区切りで複数指定でき、各項目は "ラベル:URL" または "URL" 単体で書ける
    const docs = docLink.split('|').map(s => s.trim()).filter(Boolean).map(entry => {
      const m = entry.match(/^(.*?):\s*(https?:\/\/.+)$/);
      return m ? { label: m[1].trim(), url: m[2].trim() } : { label: '', url: entry };
    });
    for (const d of docs) {
      const a = document.createElement('a');
      a.href = d.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.className = 'faq-doc';
      a.textContent = d.label ? `📄 ${d.label}` : '📄 資料を見る';
      bubble.appendChild(a);
    }
  }
  div.appendChild(av);
  div.appendChild(bubble);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function appendTyping() {
  const div = document.createElement('div');
  div.className = 'message bot'; div.id = 'typingIndicator';
  const av = document.createElement('div');
  av.className = 'avatar'; av.textContent = '🤖';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  div.appendChild(av); div.appendChild(bubble);
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}
function removeTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

// ── 未回答だった質問をGoogle Apps Script経由でスプレッドシートに追記（画面には結果を表示しない）──
function reportUnknownQuestion(question) {
  if (!APPEND_URL || APPEND_URL.indexOf('PLACEHOLDER') !== -1) return;
  fetch(APPEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ question })
  }).catch(err => console.error('未回答質問の記録に失敗:', err));
}

async function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;

  userInput.value = ''; userInput.style.height = 'auto';
  sendBtn.disabled = true;
  appendMessage('user', text);
  appendTyping();

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: SYSTEM_PROMPT + '\n\n社員からの質問: ' + text
      })
    });

    removeTyping();
    if (!res.ok) {
      appendMessage('bot', `⚠️ エラーが発生しました（${res.status}）。しばらく待ってから再試行してください。`, true);
    } else {
      const data = await res.json();
      const answerText = data.answer || '回答を取得できませんでした。';
      const isUnknown = answerText.includes(NOT_FOUND_TAG) || answerText.includes('資料に記載がない');
      if (isUnknown) {
        appendMessage('bot', '申し訳ない！まだその答えを学習していないです。総務まで（内線223）お問い合わせください。次回までには学びます！');
        reportUnknownQuestion(text);
      } else {
        const visual = findVisualForAnswer(text);
        appendMessage('bot', answerText, false, visual ? visual.image : '', visual ? visual.video : '', visual ? visual.doc : '');
      }
    }
  } catch (err) {
    removeTyping();
    appendMessage('bot', '⚠️ 通信エラーが発生しました。インターネット接続を確認してください。', true);
  }

  sendBtn.disabled = false;
  userInput.focus();
}
</script>
